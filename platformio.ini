[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; default partitions leave only 1.25 MB for the app (the rest is reserved for OTA);
; Wi-Fi + WiFiManager + FastLED don't fit, so use a 3 MB app partition without OTA
board_build.partitions = huge_app.csv

; ESP32-C3 SuperMini: Serial goes over USB-CDC; without these flags the monitor stays silent
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; 3.9+ only has an RMT driver for ESP-IDF 5; on this core (IDF 4.4) it falls back to
    ; a generic bit-bang driver with broken timing (strip stays solid white)
    fastled/FastLED@~3.7.8
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson@^7.1.0
